name: Commit Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: commit-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: curl, mbstring, simplexml, xmlreader, xmlwriter
        tools: composer:2
        coverage: none
    - name: Validate Composer files
      run: composer validate --strict
    - name: Install locked development tools
      run: composer install --no-interaction --prefer-dist --no-progress
    - name: Run lint
      run: composer php:lint
